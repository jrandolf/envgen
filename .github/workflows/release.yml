name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
          go build ./...
      - name: Build release archives
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.1
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean --skip=publish' || 'release --snapshot --clean' }}
      - name: Read version
        id: metadata
        run: echo "version=$(jq -r .version dist/metadata.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux_amd64
          - runner: ubuntu-22.04-arm
            target: linux_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-15
            target: darwin_arm64
          - runner: windows-2025
            target: windows_amd64
          - runner: windows-11-arm
            target: windows_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: archives
      - name: Verify and test packaged binary
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          suffix=tar.gz
          binary=envgen
          if [[ "$TARGET" == windows_* ]]; then
            suffix=zip
            binary=envgen.exe
          fi
          archive="envgen_${VERSION}_${TARGET}.${suffix}"
          expected=$(awk -v archive="$archive" '$2 == archive {print $1}' archives/checksums.txt)
          actual=$(openssl dgst -sha256 "archives/$archive")
          test -n "$expected"
          test "${actual##* }" = "$expected"
          mkdir unpacked
          if [[ "$suffix" == zip ]]; then
            unzip "archives/$archive" -d unpacked
          else
            tar -xzf "archives/$archive" -C unpacked
          fi
          sh scripts/smoke-test.sh "$PWD/unpacked/$binary" "$VERSION"
      - name: Test Linux binary on Alpine
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work alpine:3.23 \
            sh scripts/smoke-test.sh /work/unpacked/envgen "$VERSION"

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: [build, smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --verify-tag --generate-notes --draft "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false

  install:
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install: false
          cache: false
      - name: Install published binary through mise
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          MISE_ALL_COMPILE: "false"
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tool="github:jrandolf/envgen@$VERSION"
          mise install "$tool"
          binary=$(mise which --tool "$tool" envgen)
          sh scripts/smoke-test.sh "$binary" "$VERSION"
